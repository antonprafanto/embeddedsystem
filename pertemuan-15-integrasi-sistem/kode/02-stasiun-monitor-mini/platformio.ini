; =====================================================================
; Pertemuan 15 · Praktikum 2 — Stasiun Monitor Mini
; Mata kuliah Sistem Tertanam (Embedded Systems) — S1 Teknik Elektro
; =====================================================================
; Berkas ini mengatur cara PlatformIO mengompilasi dan mengunggah program.
; Baris "platform" sengaja menunjuk ke pioarduino (Arduino-ESP32 versi 3.3).
; Jangan diubah kecuali diminta dosen.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; Kecepatan Serial Monitor — harus sama dengan Serial.begin() di kode
monitor_speed = 115200
; Menerjemahkan pesan crash ESP32 menjadi nama fungsi dan nomor baris
monitor_filters = esp32_exception_decoder
; Perintah Serial (status, restart, bantuan): tampilkan ketikanmu dan kirim Enter sebagai LF
monitor_echo = yes
monitor_eol = LF

; Library (pustaka) tambahan — diunduh otomatis oleh PlatformIO saat Build pertama
lib_deps =
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6
    knolleary/PubSubClient@^2.8
