; Berkas ini mengatur cara PlatformIO mengompilasi dan mengunggah program.
; Baris "platform" sengaja menunjuk ke pioarduino (Arduino-ESP32 versi 3.3).
; Jangan diubah kecuali diminta dosen.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; Kecepatan Serial Monitor — harus sama dengan Serial.begin() di kode
monitor_speed = 115200
; Menerjemahkan pesan crash ESP32 menjadi nama fungsi dan nomor baris
monitor_filters = esp32_exception_decoder
; Tampilkan kembali teks yang kamu ketik di Serial Monitor
monitor_echo = yes
; Akhiri setiap baris kiriman dengan LF (\n) agar readStringUntil('\n') bekerja
monitor_eol = LF
