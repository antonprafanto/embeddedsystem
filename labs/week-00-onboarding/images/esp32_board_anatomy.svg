<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .board-body { fill: #0f172a; stroke: #020617; stroke-width: 2; rx: 8px; }
      .shield { fill: #334155; stroke: #64748b; stroke-width: 1.5; rx: 4px; }
      .antenna-zone { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 2px; }
      .antenna-trace { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; }
      .ic-chip { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.5; rx: 2px; }
      .usb-port { fill: #e2e8f0; stroke: #0f172a; stroke-width: 1.5; rx: 3px; }
      .btn-body { fill: #e2e8f0; stroke: #0f172a; stroke-width: 1.5; rx: 2px; }
      .btn-actuator { fill: #0f172a; rx: 2px; }
      .pin-header { fill: #1e293b; stroke: #64748b; stroke-width: 1; }
      .pin-hole { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; }
      .callout-line { stroke: #0f172a; stroke-width: 1.2; stroke-dasharray: 2 2; fill: none; }
      .callout-dot { fill: #0f172a; }
      .card-tag { fill: #f8fafc; stroke: #0f172a; stroke-width: 1.2; rx: 4px; }
      .tag-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .tag-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #475569; }
      .tech-label { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="838" height="538" x="1" y="1" class="bg" />

  <!-- Header -->
  <text x="30" y="38" class="title">ANATOMI PERANGKAT KERAS: ESP32-WROOM-32 DEVKIT</text>
  <text x="30" y="58" class="subtitle">Identifikasi komponen kritis: Tombol Boot/Reset, Port Pemrograman, dan Chip Converter Serial.</text>
  <line x1="30" y1="72" x2="810" y2="72" stroke="#e2e8f0" stroke-width="1" />

  <!-- MAIN BOARD DRAWING (Center) -->
  <g transform="translate(305, 95)">
    <!-- PCB Base -->
    <rect x="0" y="0" width="230" height="410" class="board-body" />

    <!-- Left Pin Header (19 pins) -->
    <rect x="6" y="25" width="16" height="360" class="pin-header" />
    <!-- Right Pin Header (19 pins) -->
    <rect x="208" y="25" width="16" height="360" class="pin-header" />

    <!-- Pin dots Left & Right -->
    <g>
      <!-- Left side pins -->
      <circle cx="14" cy="40" r="3.5" class="pin-hole" /><circle cx="14" cy="60" r="3.5" class="pin-hole" />
      <circle cx="14" cy="80" r="3.5" class="pin-hole" /><circle cx="14" cy="100" r="3.5" class="pin-hole" />
      <circle cx="14" cy="120" r="3.5" class="pin-hole" /><circle cx="14" cy="140" r="3.5" class="pin-hole" />
      <circle cx="14" cy="160" r="3.5" class="pin-hole" /><circle cx="14" cy="180" r="3.5" class="pin-hole" />
      <circle cx="14" cy="200" r="3.5" class="pin-hole" /><circle cx="14" cy="220" r="3.5" class="pin-hole" />
      <circle cx="14" cy="240" r="3.5" class="pin-hole" /><circle cx="14" cy="260" r="3.5" class="pin-hole" />
      <circle cx="14" cy="280" r="3.5" class="pin-hole" /><circle cx="14" cy="300" r="3.5" class="pin-hole" />
      <circle cx="14" cy="320" r="3.5" class="pin-hole" /><circle cx="14" cy="340" r="3.5" class="pin-hole" />
      <circle cx="14" cy="360" r="3.5" class="pin-hole" /><circle cx="14" cy="380" r="3.5" class="pin-hole" />

      <!-- Right side pins -->
      <circle cx="216" cy="40" r="3.5" class="pin-hole" /><circle cx="216" cy="60" r="3.5" class="pin-hole" />
      <circle cx="216" cy="80" r="3.5" class="pin-hole" /><circle cx="216" cy="100" r="3.5" class="pin-hole" />
      <circle cx="216" cy="120" r="3.5" class="pin-hole" /><circle cx="216" cy="140" r="3.5" class="pin-hole" />
      <circle cx="216" cy="160" r="3.5" class="pin-hole" /><circle cx="216" cy="180" r="3.5" class="pin-hole" />
      <circle cx="216" cy="200" r="3.5" class="pin-hole" /><circle cx="216" cy="220" r="3.5" class="pin-hole" />
      <circle cx="216" cy="240" r="3.5" class="pin-hole" /><circle cx="216" cy="260" r="3.5" class="pin-hole" />
      <circle cx="216" cy="280" r="3.5" class="pin-hole" /><circle cx="216" cy="300" r="3.5" class="pin-hole" />
      <circle cx="216" cy="320" r="3.5" class="pin-hole" /><circle cx="216" cy="340" r="3.5" class="pin-hole" />
      <circle cx="216" cy="360" r="3.5" class="pin-hole" /><circle cx="216" cy="380" r="3.5" class="pin-hole" />
    </g>

    <!-- Antenna Zone (Top) -->
    <rect x="40" y="8" width="150" height="50" class="antenna-zone" />
    <path d="M 50 45 L 50 20 L 70 20 L 70 40 L 90 40 L 90 20 L 110 20 L 110 40 L 130 40 L 130 20 L 150 20 L 150 40 L 170 40 L 170 20" class="antenna-trace" />
    <text x="75" y="52" class="tech-label">2.4 GHz PCB ANTENNA</text>

    <!-- RF Metal Shield (ESP-WROOM-32) -->
    <rect x="36" y="65" width="158" height="150" class="shield" />
    <text x="65" y="135" font-family="-apple-system, sans-serif" font-size="14px" font-weight="700" fill="#f8fafc">ESP-WROOM-32</text>
    <text x="70" y="155" class="tech-label">Dual Core Xtensa 32-bit</text>
    <text x="78" y="170" class="tech-label">Wi-Fi + BLE SoC</text>

    <!-- USB-to-UART Bridge IC (CP2102 / CH340) -->
    <rect x="95" y="240" width="40" height="40" class="ic-chip" />
    <text x="100" y="260" font-family="monospace" font-size="8px" fill="#f8fafc">CP2102</text>
    <text x="103" y="272" font-family="monospace" font-size="7px" fill="#94a3b8">BRIDGE</text>

    <!-- 3.3V Voltage Regulator -->
    <rect x="50" y="245" width="30" height="20" class="ic-chip" />
    <text x="54" y="258" class="tech-label">AMS1117</text>

    <!-- LEDs -->
    <!-- Power LED (Red/PWR) -->
    <rect x="55" y="310" width="10" height="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" />
    <circle cx="60" cy="314" r="2.5" fill="#0f172a" />
    <text x="40" y="332" class="tech-label">PWR LED</text>

    <!-- Builtin User LED (Blue/GPIO 2) -->
    <rect x="165" y="310" width="10" height="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" />
    <circle cx="170" cy="314" r="2.5" fill="#475569" />
    <text x="155" y="332" class="tech-label">GPIO 2 (LED)</text>

    <!-- Left Button: EN / RST -->
    <rect x="42" y="348" width="28" height="28" class="btn-body" />
    <circle cx="56" cy="362" r="7" class="btn-actuator" />
    <text x="45" y="390" font-family="-apple-system, sans-serif" font-size="10px" font-weight="700" fill="#f8fafc">EN</text>

    <!-- Right Button: BOOT / GPIO 0 -->
    <rect x="160" y="348" width="28" height="28" class="btn-body" />
    <circle cx="174" cy="362" r="7" class="btn-actuator" />
    <text x="157" y="390" font-family="-apple-system, sans-serif" font-size="10px" font-weight="700" fill="#f8fafc">BOOT</text>

    <!-- USB Port (Micro-USB / Type-C) -->
    <rect x="90" y="375" width="50" height="40" class="usb-port" />
    <rect x="100" y="395" width="30" height="15" fill="#0f172a" rx="2" />
  </g>

  <!-- LEFT CALLOUTS -->
  <!-- Callout 1: Tombol EN (Reset) -->
  <line x1="180" y1="460" x2="350" y2="460" class="callout-line" />
  <circle cx="350" cy="460" r="3.5" class="callout-dot" />
  <rect x="25" y="430" width="220" height="58" class="card-tag" />
  <text x="35" y="450" class="tag-title">TOMBOL EN (RESET)</text>
  <text x="35" y="468" class="tag-desc">Tekan untuk me-restart mikrokontroler</text>
  <text x="35" y="482" class="tag-desc">menjalankan kode dari baris awal.</text>

  <!-- Callout 2: Chip USB-to-UART -->
  <line x1="180" y1="355" x2="400" y2="355" class="callout-line" />
  <circle cx="400" cy="355" r="3.5" class="callout-dot" />
  <rect x="25" y="325" width="220" height="58" class="card-tag" />
  <text x="35" y="345" class="tag-title">CHIP USB-TO-UART</text>
  <text x="35" y="363" class="tag-desc">Jembatan serial komputer (CP2102/CH340).</text>
  <text x="35" y="377" class="tag-desc">Wajib diinstal driver-nya di laptop!</text>

  <!-- Callout 3: Antena PCB -->
  <line x1="180" y1="120" x2="355" y2="120" class="callout-line" />
  <circle cx="355" cy="120" r="3.5" class="callout-dot" />
  <rect x="25" y="95" width="220" height="50" class="card-tag" />
  <text x="35" y="115" class="tag-title">ANTENA TRACE 2.4 GHz</text>
  <text x="35" y="133" class="tag-desc">Area bebas logam untuk sinyal Wi-Fi &amp; BLE.</text>


  <!-- RIGHT CALLOUTS -->
  <!-- Callout 4: SoC ESP32 Metal Shield -->
  <line x1="495" y1="230" x2="595" y2="230" class="callout-line" />
  <circle cx="495" cy="230" r="3.5" class="callout-dot" />
  <rect x="595" y="200" width="220" height="60" class="card-tag" />
  <text x="605" y="220" class="tag-title">MODUL ESP-WROOM-32</text>
  <text x="605" y="238" class="tag-desc">CPU Xtensa 32-bit Dual Core,</text>
  <text x="605" y="252" class="tag-desc">520 KB SRAM, Flash internal 4 MB.</text>

  <!-- Callout 5: Tombol BOOT (GPIO 0) -->
  <line x1="480" y1="460" x2="595" y2="460" class="callout-line" />
  <circle cx="480" cy="460" r="3.5" class="callout-dot" />
  <rect x="595" y="425" width="220" height="72" class="card-tag" />
  <text x="605" y="445" class="tag-title">TOMBOL BOOT (GPIO 0)</text>
  <text x="605" y="463" class="tag-desc">PENTING: Tahan tombol ini 2 detik</text>
  <text x="605" y="477" class="tag-desc">jika upload macet di tulisan</text>
  <text x="605" y="491" class="tag-desc">"Connecting........_____....."</text>

  <!-- Callout 6: Port USB -->
  <line x1="420" y1="510" x2="420" y2="520" />
</svg>
