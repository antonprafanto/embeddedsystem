; =============================================================================
; PLATFORMIO CONFIGURATION FILE - MINGGU 11: LOW-POWER & DEEP SLEEP OPTIMIZATION
; Laboratorium Sistem Tertanam (Embedded Systems) - Teknik Elektro
; Target Hardware: ESP32-WROOM-32 / ESP32-S3 (30/38 Pin DevKit)
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Kecepatan komunikasi Serial Monitor (Baud Rate)
monitor_speed = 115200

; Filter otomatis Serial Monitor untuk debugging dan dekode crash
monitor_filters = 
    esp32_exception_decoder
    time

; Mode build debug untuk mempermudah penelusuran crash backtrace
build_type = debug

; Catatan: API Power Management & Sleep Modes (esp_sleep.h)
; sudah terintegrasi secara native di dalam ESP-IDF & Arduino Core ESP32.
